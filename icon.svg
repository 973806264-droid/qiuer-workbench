<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF0F3"/>
      <stop offset="100%" stop-color="#D5DFE8"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 装饰圆点 -->
  <circle cx="100" cy="100" r="14" fill="#7B9BAA" opacity="0.5"/>
  <circle cx="420" cy="90" r="10" fill="#5B8FA8" opacity="0.45"/>
  <circle cx="430" cy="420" r="16" fill="#B8CDE0" opacity="0.6"/>
  <circle cx="80" cy="430" r="12" fill="#C5D4DE" opacity="0.6"/>

  <!-- 三张错落的新闻卡片 -->
  <!-- 底层卡片 -->
  <rect x="130" y="165" width="260" height="150" rx="22" fill="url(#card1)" stroke="#7B9BAA" stroke-width="4"/>
  <rect x="155" y="190" width="120" height="10" rx="5" fill="#7B9BAA"/>
  <rect x="155" y="210" width="200" height="7" rx="3.5" fill="#D8DFE6"/>
  <rect x="155" y="226" width="180" height="7" rx="3.5" fill="#D8DFE6"/>
  <rect x="155" y="252" width="50" height="16" rx="8" fill="#7B9BAA"/>

  <!-- 中层卡片 -->
  <rect x="105" y="120" width="260" height="150" rx="22" fill="url(#card1)" stroke="#5B8FA8" stroke-width="4"/>
  <rect x="130" y="145" width="120" height="10" rx="5" fill="#5B8FA8"/>
  <rect x="130" y="165" width="200" height="7" rx="3.5" fill="#D8DFE6"/>
  <rect x="130" y="181" width="170" height="7" rx="3.5" fill="#D8DFE6"/>
  <rect x="130" y="207" width="50" height="16" rx="8" fill="#5B8FA8"/>

  <!-- 顶层卡片 -->
  <rect x="155" y="100" width="260" height="150" rx="22" fill="url(#card1)" stroke="#B8CDE0" stroke-width="4"/>
  <rect x="180" y="125" width="120" height="10" rx="5" fill="#688996"/>
  <rect x="180" y="145" width="200" height="7" rx="3.5" fill="#D8DFE6"/>
  <rect x="180" y="161" width="160" height="7" rx="3.5" fill="#D8DFE6"/>
  <rect x="180" y="187" width="50" height="16" rx="8" fill="#B8CDE0"/>

  <!-- qiuer 文字 -->
  <text x="256" y="400" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#3D4F5C" text-anchor="middle" letter-spacing="2">qiuer</text>
  <text x="256" y="430" font-family="Courier New, monospace" font-size="16" fill="#8A9AA5" text-anchor="middle" letter-spacing="6">WORKBENCH</text>
</svg>
