<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qiuer的工作台 ✨ Daily News Workbench</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="qiuer工作台">
<style>
:root{
  /* 科技蓝莫兰迪 - 低饱和灰蓝调，冷静专业 */
  --bg:#EDF0F3;        /* 极浅灰蓝 主背景 */
  --bg2:#E0E5EA;       /* 略深灰蓝 次背景 */
  --card:#FFFFFF;      /* 纯白 卡片 */
  --card2:#F5F7FA;     /* 浅灰蓝白 */
  --accent:#7B9BAA;    /* 灰蓝 强调色 */
  --accent2:#688996;   /* 深灰蓝 */
  --fg:#3D4F5C;        /* 深蓝灰 主文字 */
  --fg2:#8A9AA5;       /* 浅蓝灰 次文字 */
  --hi:#5B8FA8;        /* 科技蓝 高亮 */
  --hi2:#4A7A93;       /* 深科技蓝 */
  --border:#D8DFE6;    /* 浅蓝灰边框 */
  --border2:#C5CFD8;   /* 略深蓝灰边框 */
  --serif:'Georgia','Noto Serif SC','Songti SC','SimSun',serif;
  --mono:'Courier New','Menlo',monospace;
  --sans:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse at top, #F4F6F9 0%, var(--bg) 60%, #E5EAEF 100%);
  color:var(--fg); font-family:var(--sans); min-height:100vh;
  padding:0;
}
/* 顶部纸纹质感 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    repeating-linear-gradient(0deg, rgba(123,155,170,.022) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(91,143,168,.02) 0 1px, transparent 1px 3px);
}
.app{position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:24px 20px 60px}

/* ===== 主菜单卡片 ===== */
.toolbar-compact{padding:10px 14px; margin-bottom:14px}
.menu-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; margin-top:20px}
.menu-card{
  background:linear-gradient(135deg, #FFFFFF, #F5F7FA);
  border:1.5px solid var(--border); border-radius:18px;
  padding:18px 20px; cursor:pointer; transition:all .25s;
  position:relative; overflow:hidden;
  box-shadow:0 4px 16px rgba(123,155,170,.1);
}
.menu-card:hover{transform:translateY(-4px); box-shadow:0 14px 32px rgba(123,155,170,.22); border-color:var(--accent)}
.menu-card::before{
  content:""; position:absolute; top:-30px; right:-30px; width:120px; height:120px;
  border-radius:50%; opacity:.18; transition:transform .3s;
}
.menu-news::before{background:radial-gradient(circle, var(--accent), transparent 70%)}
.menu-talent::before{background:radial-gradient(circle, var(--hi2), transparent 70%)}
.menu-card:hover::before{transform:scale(1.3)}
.menu-icon{font-size:36px; margin-bottom:10px; line-height:1}
.menu-title{
  font-family:var(--serif); font-size:20px; font-weight:700; color:var(--fg);
  margin-bottom:6px; letter-spacing:1px;
}
.menu-desc{font-size:12px; color:var(--fg2); line-height:1.5; margin-bottom:10px}
.menu-meta{font-size:10px; color:var(--accent2); font-family:var(--mono); letter-spacing:1px}

/* ===== 返回按钮 ===== */
.back-bar{margin-bottom:14px}
.btn-back{
  background:#FFFFFF; border:1.5px solid var(--border2); color:var(--fg);
  padding:7px 14px; border-radius:18px; cursor:pointer; font-size:12px;
  font-family:var(--sans); transition:all .2s;
  box-shadow:0 2px 6px rgba(123,155,170,.08);
}
.btn-back:hover{border-color:var(--accent); color:var(--accent2); transform:translateX(-2px)}

/* ===== 人才工作台样式 ===== */
.talent-banner{
  background:linear-gradient(135deg, var(--accent2), var(--hi2));
  border-radius:18px; padding:22px 20px; margin-bottom:14px;
  color:#FFFFFF; box-shadow:0 6px 18px rgba(91,143,168,.25);
  position:relative; overflow:hidden;
}
.talent-banner::before{
  content:""; position:absolute; top:-30px; right:-30px; width:140px; height:140px;
  border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.15), transparent 70%);
}
.talent-banner::after{
  content:""; position:absolute; bottom:-40px; left:30%; width:100px; height:100px;
  border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.1), transparent 70%);
}
.banner-title{font-family:var(--serif); font-size:22px; font-weight:700; letter-spacing:1px; margin-bottom:6px; position:relative; z-index:1}
.banner-sub{font-size:12px; opacity:.85; letter-spacing:1px; position:relative; z-index:1}

.talent-stats{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:0;
  background:#FFFFFF; border:1px solid var(--border); border-radius:14px;
  margin-bottom:18px; overflow:hidden;
  box-shadow:0 2px 8px rgba(123,155,170,.08);
}
.stat-item{text-align:center; padding:14px 4px; position:relative}
.stat-item:not(:last-child)::after{
  content:""; position:absolute; right:0; top:18%; height:64%; width:1px;
  background:var(--border);
}
.stat-num{
  font-family:var(--serif); font-size:26px; font-weight:700; color:var(--hi2);
  line-height:1; margin-bottom:4px;
}
.stat-label{font-size:11px; color:var(--fg2); letter-spacing:.5px}

.filter-group{margin-bottom:14px}
.filter-label{
  font-size:13px; font-weight:600; color:var(--fg);
  margin-bottom:10px; letter-spacing:1px;
}
.filter-chips{display:flex; gap:8px; flex-wrap:wrap}
.filter-chips .chip{
  font-size:12px; padding:6px 14px; border-radius:16px; cursor:pointer;
  background:#FFFFFF; border:1.5px solid var(--border); color:var(--fg);
  user-select:none; transition:all .2s; font-family:var(--sans);
}
.filter-chips .chip:hover{border-color:var(--accent); transform:translateY(-1px)}
.filter-chips .chip.on{
  background:var(--accent); color:#FFFFFF; border-color:var(--accent2);
  box-shadow:0 3px 10px rgba(123,155,170,.3);
}

.search-bar{
  background:#FFFFFF; border:1.5px solid var(--border); border-radius:14px;
  padding:10px 16px; display:flex; align-items:center; gap:10px;
  margin-bottom:14px; transition:all .2s;
  box-shadow:0 2px 6px rgba(123,155,170,.05);
}
.search-bar:focus-within{border-color:var(--accent); box-shadow:0 4px 12px rgba(123,155,170,.12)}
.search-icon{font-size:14px; opacity:.6}
.search-bar input{
  flex:1; border:none; outline:none; background:transparent;
  color:var(--fg); font-size:13px; font-family:var(--sans);
}

/* 人才文章专属卡片 */
.talent-card{
  background:#FFFFFF; border:1px solid var(--border); border-radius:14px;
  padding:16px 18px; margin-bottom:12px; transition:all .2s;
  box-shadow:0 2px 6px rgba(123,155,170,.06);
}
.talent-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(123,155,170,.15); border-color:var(--accent)}
.talent-meta{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
.talent-topic{
  font-size:11px; padding:3px 10px; border-radius:8px; font-weight:600;
}
.talent-date{font-size:11px; color:var(--fg2); font-family:var(--mono)}
.talent-card .title{
  font-family:var(--serif); font-size:16px; font-weight:700; color:var(--fg);
  line-height:1.4; margin-bottom:8px;
}
.talent-card .title a{color:inherit; text-decoration:none}
.talent-card .title a:hover{color:var(--hi2)}
.talent-card .summary{font-size:13px; color:var(--fg2); line-height:1.65; margin-bottom:12px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.talent-footer{
  display:flex; justify-content:space-between; align-items:center;
  padding-top:10px; border-top:1px dashed var(--border);
  font-size:11px; color:var(--fg2);
}
.talent-footer .src-label{font-family:var(--mono)}
.talent-footer .read-link{
  color:var(--hi2); font-weight:600; text-decoration:none; font-size:12px;
  transition:color .15s;
}
.talent-footer .read-link:hover{color:var(--accent2)}

@media(max-width:680px){
  .talent-stats{grid-template-columns:repeat(4, 1fr)}
  .stat-num{font-size:20px}
  .banner-title{font-size:18px}
}

/* ===== 头部 ===== */
header{border-bottom:2px solid var(--border); padding-bottom:18px; margin-bottom:20px}
.brand{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap}
.brand h1{
  font-family:var(--serif); font-size:30px; font-weight:700;
  color:var(--fg); letter-spacing:1px; line-height:1;
}
.brand .en{font-family:var(--mono); font-size:11px; color:var(--hi2); letter-spacing:3px; text-transform:uppercase; margin-top:6px}
.brand .meta{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--fg2); text-align:right}
.brand .meta div:first-child{color:var(--hi2); font-size:14px}

/* ===== 工具栏 ===== */
.toolbar{
  background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(245,247,250,.55));
  border:1px solid var(--border); border-radius:20px;
  padding:16px; margin-bottom:22px;
  display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  box-shadow:0 4px 14px rgba(123,155,170,.1);
}
.field{display:flex; flex-direction:column; gap:4px}
.field label{font-size:10px; color:var(--fg2); font-family:var(--mono); letter-spacing:1px; text-transform:uppercase}
.field input[type=text], .field input[type=date], .field select{
  background:#FBFCFD; border:1.5px solid var(--border2); border-radius:12px;
  color:var(--fg); padding:9px 12px; font-size:13px; font-family:var(--sans);
  outline:none; transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(123,155,170,.3)}
.field input[type=date]{color-scheme:light}
.cat-select{min-width:140px}
.btns{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
.btn{
  background:var(--accent); color:#FFFFFF; border:none;
  border-radius:20px; padding:9px 18px; font-size:13px; cursor:pointer;
  font-family:var(--sans); transition:all .2s; font-weight:600;
}
.btn:hover{background:var(--accent2); transform:translateY(-1px); box-shadow:0 4px 10px rgba(123,155,170,.3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--fg); border:1.5px solid var(--border2)}
.btn.ghost:hover{background:rgba(123,155,170,.15); box-shadow:none}
.btn.hi{background:var(--hi2); color:#FFFFFF}
.btn.hi:hover{background:var(--hi); box-shadow:0 4px 10px rgba(91,143,168,.35)}
.cat-chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-size:11px; padding:5px 12px; border-radius:16px; cursor:pointer;
  background:#FBFCFD; border:1.5px solid var(--border2); color:var(--fg2);
  user-select:none; transition:all .2s; font-family:var(--mono);
}
.chip:hover{border-color:var(--accent); transform:translateY(-1px)}
.chip.on{background:var(--accent); color:#FFFFFF; border-color:var(--accent2); box-shadow:0 2px 8px rgba(123,155,170,.3)}

/* ===== 视图切换 ===== */
.view-tabs{display:flex; gap:0; margin-bottom:18px; border-bottom:2px solid var(--border2)}
.view-tabs button{
  background:none; border:none; color:var(--fg2); cursor:pointer;
  padding:10px 22px; font-size:14px; font-family:var(--serif); letter-spacing:1px;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:all .15s;
}
.view-tabs button:hover{color:var(--fg)}
.view-tabs button.active{color:var(--hi2); border-bottom-color:var(--hi2)}

/* ===== 日历（前后两周横向条带）===== */
.cal-nav{display:flex; gap:8px}
.cal-nav button{
  background:#FFFFFF; border:1.5px solid var(--border2); color:var(--fg);
  width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:15px;
  transition:all .2s; box-shadow:0 2px 6px rgba(123,155,170,.1);
}
.cal-nav button:hover{border-color:var(--accent); color:var(--accent2); transform:translateY(-1px)}
.cal-strip{
  display:flex; gap:8px; overflow-x:auto; padding:6px 4px 14px; margin-bottom:20px;
  scroll-behavior:smooth;
}
.cal-strip::-webkit-scrollbar{height:5px}
.cal-strip::-webkit-scrollbar-track{background:#E5EAEF; border-radius:3px}
.cal-strip::-webkit-scrollbar-thumb{background:var(--accent); border-radius:3px}
.cal-cell{
  flex:0 0 auto; width:64px; padding:8px 6px; border-radius:18px; cursor:pointer;
  background:#FFFFFF; border:1.5px solid var(--border); text-align:center;
  position:relative; transition:all .2s;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  box-shadow:0 2px 6px rgba(123,155,170,.08);
}
.cal-cell:hover{border-color:var(--accent); background:linear-gradient(180deg, #FCFDFE, #EBF2F6); transform:translateY(-2px); box-shadow:0 6px 14px rgba(123,155,170,.18)}
.cal-cell .dow{font-size:10px; font-family:var(--mono); color:var(--fg2); letter-spacing:1px}
.cal-cell .num{font-family:var(--serif); font-size:20px; font-weight:700; color:var(--fg); line-height:1}
.cal-cell .cnt{
  font-size:9px; font-family:var(--mono); color:#FFFFFF;
  background:var(--accent); padding:1px 6px; border-radius:8px; margin-top:1px;
}
.cal-cell.today{
  border-color:var(--hi2);
  background:linear-gradient(180deg, #DDEAF1, #C9DCE8);
}
.cal-cell.today .num{color:var(--hi2)}
.cal-cell.today .dow{color:var(--hi2)}
.cal-cell.selected{box-shadow:0 0 0 2px var(--hi) inset; border-color:var(--hi)}
.cal-cell.has-news .num::after{
  content:""; position:absolute; top:7px; right:7px; width:5px; height:5px;
  border-radius:50%; background:var(--hi2);
}
.cal-cell .dots{display:flex; gap:2px; margin-top:1px; min-height:6px}
.cal-cell .dot{width:5px; height:5px; border-radius:50%}

/* ===== 新闻列表 ===== */
.news-panel{margin-top:8px}
.news-head{display:flex; align-items:baseline; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.news-head h2{font-family:var(--serif); font-size:22px; color:var(--fg)}
.news-head .date{font-family:var(--mono); font-size:13px; color:var(--hi2)}
.news-head .sub{font-size:12px; color:var(--fg2); margin-left:auto}
.news-list{display:flex; flex-direction:column; gap:12px}
.news-card{
  background:linear-gradient(180deg, var(--card), var(--card2));
  border:1px solid var(--border); border-radius:18px;
  padding:16px 18px; display:flex; gap:14px; position:relative;
  transition:all .2s; color:var(--fg);
  box-shadow:0 2px 8px rgba(123,155,170,.08);
}
.news-card:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(123,155,170,.2); border-color:var(--accent)}
.news-card .rank{
  font-family:var(--serif); font-size:24px; font-weight:700;
  color:var(--hi2); min-width:30px; text-align:center;
  line-height:1.2; padding-top:2px; flex-shrink:0; opacity:.7;
}
.news-card .body{flex:1; min-width:0}
.news-card .title{
  font-family:var(--serif); font-size:16px; font-weight:700; color:var(--fg);
  line-height:1.4; margin-bottom:6px;
}
.news-card .title a{color:inherit; text-decoration:none}
.news-card .title a:hover{color:var(--hi2)}
.news-card .summary{font-size:13px; color:var(--fg2); line-height:1.6; margin-bottom:8px}
.news-card .tags{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.news-card .tag{
  font-size:10px; font-family:var(--mono); letter-spacing:.5px;
  background:#F5F7FA; color:var(--fg2); padding:3px 9px; border-radius:10px;
  border:1px solid var(--border);
}
.news-card .tag.cat{background:transparent; color:var(--accent2); border-color:var(--accent); font-weight:600}
.news-card .src{font-size:11px; color:var(--fg2); font-family:var(--mono)}
.news-card .fav{
  position:absolute; top:12px; right:14px; cursor:pointer;
  font-size:18px; color:rgba(61,79,92,.2); background:none; border:none;
  transition:color .15s, transform .15s; line-height:1;
}
.news-card .fav:hover{color:var(--hi); transform:scale(1.15)}
.news-card .fav.on{color:var(--hi2)}
.news-card.read{opacity:.6}
.news-card.read .title{font-weight:400}

/* 空状态 */
.empty{
  text-align:center; padding:50px 20px; color:var(--fg2);
  font-family:var(--serif); font-size:16px;
}
.empty .icon{font-size:40px; margin-bottom:10px; opacity:.5}

/* 搜索结果 */
.result-meta{font-size:12px; color:var(--fg2); margin-bottom:14px; font-family:var(--mono)}
.result-meta b{color:var(--hi2)}

/* 底部 */
footer{
  margin-top:40px; padding-top:18px; border-top:1px solid var(--border2);
  font-size:11px; color:var(--fg2); font-family:var(--mono); text-align:center;
  letter-spacing:1px;
}
footer .refresh{color:var(--hi2); cursor:pointer; text-decoration:none; margin-left:8px}
footer .refresh:hover{text-decoration:underline}

/* 加载提示 */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#FFFFFF; border:1px solid var(--accent2); color:var(--fg);
  padding:12px 22px; border-radius:20px; font-size:13px; z-index:100;
  box-shadow:0 8px 24px rgba(123,155,170,.25); opacity:0; transition:opacity .25s, transform .25s;
  pointer-events:none; font-weight:600;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

/* 响应式 */
@media(max-width:680px){
  .brand .meta{display:none}
  .menu-grid{grid-template-columns:1fr; gap:14px}
  .menu-card{padding:16px 18px}
  .menu-icon{font-size:32px}
  .menu-title{font-size:18px}
  .cal-cell{width:54px}
  .cal-cell .num{font-size:17px}
  .news-card{flex-direction:column; gap:6px}
  .news-card .rank{font-size:20px; min-width:0; text-align:left}
  .field{flex:1; min-width:120px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 头部 ===== -->
  <header>
    <div class="brand">
      <div>
        <h1>qiuer的工作台 🗞️</h1>
        <div class="en">QIUER'S WORKBENCH · DAILY NEWS</div>
      </div>
      <div class="meta">
        <div id="todayLabel">—</div>
        <div id="weekLabel">—</div>
      </div>
    </div>
  </header>

  <!-- ===== 主页菜单（两个大卡片入口）===== -->
  <section id="menuView">
    <div class="menu-grid">
      <div class="menu-card menu-news" data-target="news">
        <div class="menu-icon">📰</div>
        <div class="menu-title">每日新闻</div>
        <div class="menu-desc">每天10条精选热点新闻，日历视图，随时回顾</div>
        <div class="menu-meta">每日10条 · 日历展示</div>
      </div>
      <div class="menu-card menu-talent" data-target="talent">
        <div class="menu-icon">🎓</div>
        <div class="menu-title">人才工作文章</div>
        <div class="menu-desc">汇集官方权威发布的人才政策、讲话与实践文章</div>
        <div class="menu-meta">近三年精选 · 官方来源</div>
      </div>
    </div>
  </section>

  <!-- ===== 每日新闻应用 ===== -->
  <section id="newsApp" style="display:none">
    <div class="back-bar">
      <button class="btn-back" id="backFromNews">← 返回工作台</button>
    </div>

    <!-- 工具栏（仅分类筛选） -->
    <div class="toolbar toolbar-compact">
      <div class="field" style="flex:1; min-width:200px">
        <label>分类筛选</label>
        <div class="cat-chips" id="catChips"></div>
      </div>
    </div>

    <!-- 视图切换 -->
    <div class="view-tabs">
      <button data-view="calendar" class="active">📅 日历视图</button>
      <button data-view="search">🔎 按分类查看</button>
    </div>

    <!-- 日历视图 -->
    <div id="calView">
      <div class="cal-head" style="margin-bottom:12px">
        <div class="ym"><span class="year" id="calYear"></span><span id="calRange"></span></div>
        <div class="cal-nav">
          <button id="prevWeek" title="前两周">‹‹</button>
          <button id="todayBtn" title="回到今天">今</button>
          <button id="nextWeek" title="后两周">››</button>
        </div>
      </div>
      <div class="cal-strip" id="calStrip"></div>

    }
  }catch(e){ state.data={}; }
  // 合并种子（种子为基线，不覆盖用户已存在日期）
  Object.keys(SEED).forEach(d=>{
    if(!state.data[d]) state.data[d] = JSON.parse(JSON.stringify(SEED[d]));
  });
  try{ state.fav = JSON.parse(localStorage.getItem(LS_FAV)||'{}'); }catch(e){ state.fav={}; }
  try{ state.read = JSON.parse(localStorage.getItem(LS_READ)||'{}'); }catch(e){ state.read={}; }
  saveData();
}
function saveData(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.data)); }catch(e){}
  try{ localStorage.setItem(LS_FAV, JSON.stringify(state.fav)); }catch(e){}
  try{ localStorage.setItem(LS_READ, JSON.stringify(state.read)); }catch(e){}
}

/* =========================================================
   抓取更新（尽力而为，CORS失败静默降级）
========================================================= */
const FETCH_SOURCES = [
  // RSSHub 公共节点 - 央视新闻
  {url:'https://rsshub.app/cctv/news', cat:'时政', weight:3},
  // RSSHub - 新华社
  {url:'https://rsshub.app/xinhuanet/news', cat:'时政', weight:3},
  // RSSHub - 36氪
  {url:'https://rsshub.app/36kr/newsflashes', cat:'科技', weight:2},
  // RSSHub - 澎湃新闻
  {url:'https://rsshub.app/thepaper/newsDetail/25923', cat:'社会', weight:2},
];

async function tryFetchToday(){
  const today = todayStr();
  let items = [];
  const cutoff = new Date(Date.now() - 36*3600*1000); // 36小时内

  for(const src of FETCH_SOURCES){
    try{
      const ctrl = new AbortController();
      const tid = setTimeout(()=>ctrl.abort(), 5000);
      const resp = await fetch(src.url, {signal:ctrl.signal, cache:'no-store'});
      clearTimeout(tid);
      if(!resp.ok) continue;
      const text = await resp.text();
      // 解析 RSS XML
      const doc = new DOMParser().parseFromString(text, 'text/xml');
      const elems = doc.querySelectorAll('item');
      elems.forEach((it, idx)=>{
        if(idx>=8) return;
        const title = it.querySelector('title')?.textContent?.trim() || '';
        const link = it.querySelector('link')?.textContent?.trim() || '';
        const pubD = it.querySelector('pubDate')?.textContent?.trim() || '';
        const desc = it.querySelector('description')?.textContent?.trim() || '';
        let pd = new Date(pubD);
        if(isNaN(pd)) pd = new Date();
        if(pd < cutoff) return;
        items.push({
          rank: 0,
          title: title.replace(/<[^>]+>/g,'').slice(0,80),
          summary: desc.replace(/<[^>]+>/g,'').slice(0,200),
          source: src.cat==='科技'?'36氪':src.cat==='社会'?'澎湃新闻':'央视/新华',
          category: src.cat,
          url: link,
          publishedAt: `${pd.getFullYear()}-${String(pd.getMonth()+1).padStart(2,'0')}-${String(pd.getDate()).padStart(2,'0')} ${String(pd.getHours()).padStart(2,'0')}:${String(pd.getMinutes()).padStart(2,'0')}`,
          _weight: src.weight,
          _ts: pd.getTime()
        });
      });
    }catch(e){ /* CORS 或网络失败，静默 */ }
  }

  if(items.length===0) return false;

  // 去重 + 排序 + 取Top10
  const seen = new Set();
  items = items.filter(it=>{
    const k = it.title.slice(0,20);
    if(seen.has(k)) return false; seen.add(k); return true;
  });
  items.sort((a,b)=> (b._weight - a._weight) || (b._ts - a._ts));
  items = items.slice(0,10).map((it,i)=>({...it, rank:i+1, id: uid(today, 'f'+(i+1))}));
  items.forEach(it=> delete it._weight, delete it._ts);

  // 合并：若抓取结果>=6条则替换今天，否则保留种子
  if(items.length >= 6){
    state.data[today] = items;
    saveData();
    return true;
  }
  return false;
}

/* =========================================================
   渲染：日历（前后两周横向条带）
========================================================= */
function renderCalendar(){
  const center = state.calDate; // 中心日期
  const strip = document.getElementById('calStrip');
  strip.innerHTML='';
  const today = todayStr();
  const dowNames = ['日','一','二','三','四','五','六'];

  // 以 center 为中心，前后各14天，共29天
  for(let off=-14; off<=14; off++){
    const d = new Date(center);
    d.setDate(d.getDate()+off);
    const dateStr = fmt(d);
    const news = state.data[dateStr] || [];

    const el = document.createElement('div');
    el.className = 'cal-cell';
    if(dateStr===today) el.classList.add('today');
    if(dateStr===state.selectedDate) el.classList.add('selected');
    if(news.length>0) el.classList.add('has-news');

    const dowEl = document.createElement('div');
    dowEl.className='dow'; dowEl.textContent = dowNames[d.getDay()];
    el.appendChild(dowEl);

    const numEl = document.createElement('div');
    numEl.className='num'; numEl.textContent = d.getDate();
    el.appendChild(numEl);

    if(news.length>0){
      const dots=document.createElement('div'); dots.className='dots';
      const cats=new Set(news.map(n=>n.category));
      [...cats].slice(0,3).forEach(c=>{
        const dot=document.createElement('span'); dot.className='dot';
        dot.style.background=CAT_COLORS[c]||'#8A9AA5';
        dots.appendChild(dot);
      });
      el.appendChild(dots);
      const cnt=document.createElement('div'); cnt.className='cnt'; cnt.textContent=`${news.length}条`;
      el.appendChild(cnt);
    } else {
      // 占位保持高度一致
      const ph=document.createElement('div'); ph.className='dots'; el.appendChild(ph);
    }

    el.onclick=()=>{
      state.selectedDate=dateStr;
      renderCalendar();
      renderNewsPanel(dateStr);
      // 滚动到选中项
      setTimeout(()=>{
        el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
      },30);
    };
    strip.appendChild(el);
  }

  // 更新标题
  const firstD = new Date(center); firstD.setDate(firstD.getDate()-14);
  const lastD = new Date(center); lastD.setDate(lastD.getDate()+14);
  document.getElementById('calYear').textContent = center.getFullYear()+'年';
  document.getElementById('calRange').textContent =
    `${firstD.getMonth()+1}/${firstD.getDate()} ~ ${lastD.getMonth()+1}/${lastD.getDate()}`;

  // 自动滚动到选中/今天
  setTimeout(()=>{
    const target = strip.querySelector('.cal-cell.selected') || strip.querySelector('.cal-cell.today');
    if(target) target.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  },50);
}

function renderNewsPanel(dateStr){
  const panel = document.getElementById('newsPanel');
  const news = state.data[dateStr] || [];
  const [y,mm,dd] = dateStr.split('-');
  const wk = ['日','一','二','三','四','五','六'][new Date(dateStr).getDay()];

  let html = `<div class="news-head">
    <h2>📌 每日精选 · Top 10</h2>
    <span class="date">${y}年${parseInt(mm)}月${parseInt(dd)}日 · 星期${wk}</span>
    <span class="sub">共 ${news.length} 条</span>
  </div>`;

  if(news.length===0){
    html += `<div class="empty"><div class="icon">📭</div>当日暂无新闻数据<br><span style="font-size:12px">可点击底部"立即刷新今日"尝试联网抓取</span></div>`;
    panel.innerHTML = html;
    return;
  }

  html += '<div class="news-list">';
  news.forEach(n=>{
    const id = n.id || uid(dateStr, n.rank);
    const isFav = state.fav[id] ? 'on' : '';
    const isRead = state.read[id] ? 'read' : '';
    const catColor = CAT_COLORS[n.category] || '#CCD2D8';
    const catTxt = CAT_TEXT_COLORS[n.category] || '#4A5560';
    html += `<div class="news-card ${isRead}" data-id="${id}">
      <div class="rank">${n.rank}</div>
      <div class="body">
        <div class="title"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a></div>
        <div class="summary">${n.summary}</div>
        <div class="tags">
          <span class="tag cat">${n.category}</span>
          <span class="tag src">${n.source}</span>
          <span class="tag">${n.publishedAt || ''}</span>
        </div>
      </div>
      <button class="fav ${isFav}" data-id="${id}" title="收藏">★</button>
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;

  // 绑定收藏 & 已读
  panel.querySelectorAll('.fav').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      const id = b.dataset.id;
      state.fav[id] = !state.fav[id];
      saveData();
      b.classList.toggle('on');
    };
  });
  panel.querySelectorAll('.news-card .title a').forEach(a=>{
    a.onclick = ()=>{
      const card = a.closest('.news-card');
      const id = card.dataset.id;
      state.read[id] = true; saveData();
      card.classList.add('read');
    };
  });
}

/* =========================================================
   查询功能
========================================================= */
function doSearch(){
  const cats = state.selectedCats;
  let results = [];
  Object.keys(state.data).forEach(date=>{
    (state.data[date]||[]).forEach(n=>{
      if(cats.size>0 && !cats.has(n.category)) return;
      results.push({...n, date});
    });
  });
  results.sort((a,b)=> (b.date > a.date ? 1 : -1) || (a.rank - b.rank));

  switchView('search');
  const meta = document.getElementById('resultMeta');
  meta.innerHTML = `共 <b>${results.length}</b> 条 · 分类「${cats.size?[...cats].join('/'):'全部'}」`;

  const list = document.getElementById('searchResults');
  if(results.length===0){
    list.innerHTML = `<div class="empty"><div class="icon">🔍</div>未找到匹配的新闻<br><span style="font-size:12px">换个关键词试试？</span></div>`;
    return;
  }
  list.innerHTML = results.map(n=>{
    const id = n.id || uid(n.date, n.rank);
    const isFav = state.fav[id] ? 'on' : '';
    const isRead = state.read[id] ? 'read' : '';
    const catColor = CAT_COLORS[n.category] || '#CCD2D8';
    const catTxt = CAT_TEXT_COLORS[n.category] || '#4A5560';
    const [y,mm,dd] = n.date.split('-');
    return `<div class="news-card ${isRead}" data-id="${id}">
      <div class="rank">${n.rank}</div>
      <div class="body">
        <div class="title"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a></div>
        <div class="summary">${n.summary}</div>
        <div class="tags">
          <span class="tag cat">${n.category}</span>
          <span class="tag src">${n.source}</span>
          <span class="tag">${n.date} ${n.publishedAt?.split(' ')[1]||''}</span>
        </div>
      </div>
      <button class="fav ${isFav}" data-id="${id}" title="收藏">★</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.fav').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation();
      const id = b.dataset.id;
      state.fav[id] = !state.fav[id]; saveData();
      b.classList.toggle('on');
    };
  });
  list.querySelectorAll('.news-card .title a').forEach(a=>{
    a.onclick = ()=>{
      const card = a.closest('.news-card');
      const id = card.dataset.id;
      state.read[id] = true; saveData();
      card.classList.add('read');
    };
  });
}

const TALENT_SOURCES = ["官网","官媒","公众号"];
const TALENT_TOPICS = ["政策","人才活动","人才引进","人才生态"];
const TALENT_TOPIC_COLORS = {
  "政策":"#E5D8DF",       /* 莫兰迪紫粉 */
  "人才活动":"#DDE2D7",    /* 莫兰迪绿 */
  "人才引进":"#D7DEE2",    /* 莫兰迪蓝灰 */
  "人才生态":"#E5DCC8"     /* 莫兰迪米黄 */
};
const TALENT_TOPIC_TEXT = {
  "政策":"#7A5A6E","人才活动":"#5E6E55","人才引进":"#556270","人才生态":"#7A6A55"
};

/* =========================================================
   事件绑定
========================================================= */
function bindEvents(){
  // 菜单卡片点击
  document.querySelectorAll('.menu-card').forEach(c=>{
    c.onclick = ()=> showApp(c.dataset.target);
  });
  // 返回按钮
  document.getElementById('backFromNews').onclick = ()=> showApp('menu');
  document.getElementById('backFromTalent').onclick = ()=> showApp('menu');

  // 视图切换（newsApp内）
  document.querySelectorAll('#newsApp .view-tabs button').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.view==='search' && !document.getElementById('searchResults').children.length){
        doSearch();
      } else {
        switchView(b.dataset.view);
      }
    };
  });

  document.getElementById('prevWeek').onclick = ()=>{
    state.calDate = new Date(state.calDate.getFullYear(), state.calDate.getMonth(), state.calDate.getDate()-14);
    renderCalendar();
  };
  document.getElementById('nextWeek').onclick = ()=>{
    state.calDate = new Date(state.calDate.getFullYear(), state.calDate.getMonth(), state.calDate.getDate()+14);
    renderCalendar();
  };
  document.getElementById('todayBtn').onclick = ()=>{
    state.calDate = new Date();
    state.selectedDate = todayStr();
    renderCalendar();
    renderNewsPanel(state.selectedDate);
  };

  document.getElementById('resetBtn') && (document.getElementById('resetBtn').onclick = ()=>{
    state.selectedCats.clear();
    document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.remove('on'));
    switchView('calendar');
  });

  // 人才文章按钮
  document.getElementById('talentKw').addEventListener('input', doTalentSearch);
  document.getElementById('talentReset').onclick = ()=>{
    document.getElementById('talentKw').value='';
    state.talentSource = 'all';
    state.talentTopic = 'all';
    state.talentYear = 'all';
    ['talentSourceChips','talentTopicChips','talentYearChips'].forEach(id=>{
      const box = document.getElementById(id);
      box.querySelectorAll('.chip').forEach((c,i)=>{
        c.classList.toggle('on', i===0);
      });
    });
    doTalentSearch();
    toast('已重置');
  };
}

/* =========================================================
   顶级导航：menu / news / talent
========================================================= */
function showApp(name){
  const map = {menu:'menuView', news:'newsApp', talent:'talentApp'};
  const target = map[name];
  ['menuView','newsApp','talentApp'].forEach(id=>{
    document.getElementById(id).style.display = (id===target) ? 'block' : 'none';
  });
  if(name==='talent'){
    setTimeout(()=>{ renderTalentChips(); doTalentSearch(); },30);
  }
  if(name==='news'){
    setTimeout(()=>switchView('calendar'), 30);
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   人才文章筛选与渲染
========================================================= */
function renderTalentChips(){
  // 来源类型chips
  const srcBox = document.getElementById('talentSourceChips');
  srcBox.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{
      srcBox.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      el.classList.add('on');
      state.talentSource = el.dataset.val;
      doTalentSearch();
    };
  });
  // 主题分类chips
  const topicBox = document.getElementById('talentTopicChips');
  topicBox.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{
      topicBox.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      el.classList.add('on');
      state.talentTopic = el.dataset.val;
      doTalentSearch();
    };
  });
  // 发布年份chips
  const yearBox = document.getElementById('talentYearChips');
  yearBox.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{
      yearBox.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      el.classList.add('on');
      state.talentYear = el.dataset.val;
      doTalentSearch();
    };
  });
}

function doTalentSearch(){
  const kw = document.getElementById('talentKw').value.trim().toLowerCase();
  const src = state.talentSource || 'all';
  const topic = state.talentTopic || 'all';
  const year = state.talentYear || 'all';

  let results = TALENT_ARTICLES.slice();
  if(src!=='all') results = results.filter(a=>a.sourceType===src);
  if(topic!=='all') results = results.filter(a=>a.topic===topic);
  if(year!=='all') results = results.filter(a=>a.publishDate.startsWith(year));
  if(kw){
    results = results.filter(a=>{
      const hay = (a.title+' '+a.summary+' '+a.source).toLowerCase();
      return hay.includes(kw);
    });
  }
  results.sort((a,b)=> a.publishDate < b.publishDate ? 1 : -1);

  const meta = document.getElementById('talentResultMeta');
  meta.innerHTML = `共 <b>${results.length}</b> 篇 · 来源「${src==='all'?'全部':src}」 · 主题「${topic==='all'?'全部':topic}」${year!=='all'?' · '+year+'年':''}`;

  const list = document.getElementById('talentResults');
  if(results.length===0){
    list.innerHTML = `<div class="empty"><div class="icon">🔍</div>未找到匹配的文章<br><span style="font-size:12px">换个关键词试试？</span></div>`;
    return;
  }
  list.innerHTML = results.map(a=>{
    const isRead = state.read[a.id] ? 'read' : '';
    return `<div class="talent-card ${isRead}" data-id="${a.id}">
      <div class="talent-meta">
        <span class="talent-topic" style="background:${TALENT_TOPIC_COLORS[a.topic]};color:${TALENT_TOPIC_TEXT[a.topic]}">${a.topic}</span>
        <span class="talent-date">${a.publishDate}</span>
      </div>
      <div class="title"><a href="${a.url}" target="_blank" rel="noopener">${a.title}</a></div>
      <div class="summary">${a.summary}</div>
      <div class="talent-footer">
        <span class="src-label">来源：${a.source}</span>
        <a class="read-link" href="${a.url}" target="_blank" rel="noopener">阅读原文 →</a>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.talent-card .title a').forEach(a=>{
    a.onclick = ()=>{
      const card = a.closest('.talent-card');
      const id = card.dataset.id;
      state.read[id] = true; saveData();
      card.classList.add('read');
    };
  });
}

/* =========================================================
   初始化
========================================================= */
async function init(){
  state.talentSource = 'all';
  state.talentTopic = 'all';
  state.talentYear = 'all';
  loadData();
  renderHeader();
  renderCatChips();
  renderCalendar();
  state.selectedDate = todayStr();
  renderNewsPanel(state.selectedDate);
  bindEvents();
  // 默认查询结果区也填一份
  doSearch();
}

init();
</script>
