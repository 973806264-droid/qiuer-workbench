<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qiuer的工作台 ✨ Daily News Workbench</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="qiuer工作台">
<style>
:root{
  /* 科技蓝莫兰迪 - 低饱和灰蓝调，冷静专业 */
  --bg:#EDF0F3;        /* 极浅灰蓝 主背景 */
  --bg2:#E0E5EA;       /* 略深灰蓝 次背景 */
  --card:#FFFFFF;      /* 纯白 卡片 */
  --card2:#F5F7FA;     /* 浅灰蓝白 */
  --accent:#7B9BAA;    /* 灰蓝 强调色 */
  --accent2:#688996;   /* 深灰蓝 */
  --fg:#3D4F5C;        /* 深蓝灰 主文字 */
  --fg2:#8A9AA5;       /* 浅蓝灰 次文字 */
  --hi:#5B8FA8;        /* 科技蓝 高亮 */
  --hi2:#4A7A93;       /* 深科技蓝 */
  --border:#D8DFE6;    /* 浅蓝灰边框 */
  --border2:#C5CFD8;   /* 略深蓝灰边框 */
  --serif:'Georgia','Noto Serif SC','Songti SC','SimSun',serif;
  --mono:'Courier New','Menlo',monospace;
  --sans:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse at top, #F4F6F9 0%, var(--bg) 60%, #E5EAEF 100%);
  color:var(--fg); font-family:var(--sans); min-height:100vh;
  padding:0;
}
/* 顶部纸纹质感 */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    repeating-linear-gradient(0deg, rgba(123,155,170,.022) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(91,143,168,.02) 0 1px, transparent 1px 3px);
}
.app{position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:24px 20px 60px}

/* ===== 头部 ===== */
header{border-bottom:2px solid var(--border); padding-bottom:18px; margin-bottom:20px}
.brand{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap}
.brand h1{
  font-family:var(--serif); font-size:30px; font-weight:700;
  color:var(--fg); letter-spacing:1px; line-height:1;
}
.brand .en{font-family:var(--mono); font-size:11px; color:var(--hi2); letter-spacing:3px; text-transform:uppercase; margin-top:6px}
.brand .meta{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--fg2); text-align:right}
.brand .meta div:first-child{color:var(--hi2); font-size:14px}

/* ===== 工具栏 ===== */
.toolbar{
  background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(245,247,250,.55));
  border:1px solid var(--border); border-radius:20px;
  padding:16px; margin-bottom:22px;
  display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  box-shadow:0 4px 14px rgba(123,155,170,.1);
}
.field{display:flex; flex-direction:column; gap:4px}
.field label{font-size:10px; color:var(--fg2); font-family:var(--mono); letter-spacing:1px; text-transform:uppercase}
.field input[type=text], .field input[type=date], .field select{
  background:#FBFCFD; border:1.5px solid var(--border2); border-radius:12px;
  color:var(--fg); padding:9px 12px; font-size:13px; font-family:var(--sans);
  outline:none; transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(123,155,170,.3)}
.field input[type=date]{color-scheme:light}
.cat-select{min-width:140px}
.btns{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
.btn{
  background:var(--accent); color:#FFFFFF; border:none;
  border-radius:20px; padding:9px 18px; font-size:13px; cursor:pointer;
  font-family:var(--sans); transition:all .2s; font-weight:600;
}
.btn:hover{background:var(--accent2); transform:translateY(-1px); box-shadow:0 4px 10px rgba(123,155,170,.3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--fg); border:1.5px solid var(--border2)}
.btn.ghost:hover{background:rgba(123,155,170,.15); box-shadow:none}
.btn.hi{background:var(--hi2); color:#FFFFFF}
.btn.hi:hover{background:var(--hi); box-shadow:0 4px 10px rgba(91,143,168,.35)}
.cat-chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-size:11px; padding:5px 12px; border-radius:16px; cursor:pointer;
  background:#FBFCFD; border:1.5px solid var(--border2); color:var(--fg2);
  user-select:none; transition:all .2s; font-family:var(--mono);
}
.chip:hover{border-color:var(--accent); transform:translateY(-1px)}
.chip.on{background:var(--accent); color:#FFFFFF; border-color:var(--accent2); box-shadow:0 2px 8px rgba(123,155,170,.3)}

/* ===== 视图切换 ===== */
.view-tabs{display:flex; gap:0; margin-bottom:18px; border-bottom:2px solid var(--border2)}
.view-tabs button{
  background:none; border:none; color:var(--fg2); cursor:pointer;
  padding:10px 22px; font-size:14px; font-family:var(--serif); letter-spacing:1px;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:all .15s;
}
.view-tabs button:hover{color:var(--fg)}
.view-tabs button.active{color:var(--hi2); border-bottom-color:var(--hi2)}

/* ===== 日历（前后两周横向条带）===== */
.cal-nav{display:flex; gap:8px}
.cal-nav button{
  background:#FFFFFF; border:1.5px solid var(--border2); color:var(--fg);
  width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:15px;
  transition:all .2s; box-shadow:0 2px 6px rgba(123,155,170,.1);
}
.cal-nav button:hover{border-color:var(--accent); color:var(--accent2); transform:translateY(-1px)}
.cal-strip{
  display:flex; gap:8px; overflow-x:auto; padding:6px 4px 14px; margin-bottom:20px;
  scroll-behavior:smooth;
}
.cal-strip::-webkit-scrollbar{height:5px}
.cal-strip::-webkit-scrollbar-track{background:#E5EAEF; border-radius:3px}
.cal-strip::-webkit-scrollbar-thumb{background:var(--accent); border-radius:3px}
.cal-cell{
  flex:0 0 auto; width:64px; padding:8px 6px; border-radius:18px; cursor:pointer;
  background:#FFFFFF; border:1.5px solid var(--border); text-align:center;
  position:relative; transition:all .2s;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  box-shadow:0 2px 6px rgba(123,155,170,.08);
}
.cal-cell:hover{border-color:var(--accent); background:linear-gradient(180deg, #FCFDFE, #EBF2F6); transform:translateY(-2px); box-shadow:0 6px 14px rgba(123,155,170,.18)}
.cal-cell .dow{font-size:10px; font-family:var(--mono); color:var(--fg2); letter-spacing:1px}
.cal-cell .num{font-family:var(--serif); font-size:20px; font-weight:700; color:var(--fg); line-height:1}
.cal-cell .cnt{
  font-size:9px; font-family:var(--mono); color:#FFFFFF;
  background:var(--accent); padding:1px 6px; border-radius:8px; margin-top:1px;
}
.cal-cell.today{
  border-color:var(--hi2);
  background:linear-gradient(180deg, #DDEAF1, #C9DCE8);
}
.cal-cell.today .num{color:var(--hi2)}
.cal-cell.today .dow{color:var(--hi2)}
.cal-cell.selected{box-shadow:0 0 0 2px var(--hi) inset; border-color:var(--hi)}
.cal-cell.has-news .num::after{
  content:""; position:absolute; top:7px; right:7px; width:5px; height:5px;
  border-radius:50%; background:var(--hi2);
}
.cal-cell .dots{display:flex; gap:2px; margin-top:1px; min-height:6px}
.cal-cell .dot{width:5px; height:5px; border-radius:50%}

/* ===== 新闻列表 ===== */
.news-panel{margin-top:8px}
.news-head{display:flex; align-items:baseline; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.news-head h2{font-family:var(--serif); font-size:22px; color:var(--fg)}
.news-head .date{font-family:var(--mono); font-size:13px; color:var(--hi2)}
.news-head .sub{font-size:12px; color:var(--fg2); margin-left:auto}
.news-list{display:flex; flex-direction:column; gap:12px}
.news-card{
  background:linear-gradient(180deg, var(--card), var(--card2));
  border:1px solid var(--border); border-radius:18px;
  padding:16px 18px; display:flex; gap:14px; position:relative;
  transition:all .2s; color:var(--fg);
  box-shadow:0 2px 8px rgba(123,155,170,.08);
}
.news-card:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(123,155,170,.2); border-color:var(--accent)}
.news-card .rank{
  font-family:var(--serif); font-size:22px; font-weight:700;
  background:linear-gradient(135deg, var(--hi), var(--hi2));
  color:#FFFFFF; min-width:38px; height:38px; text-align:center;
  line-height:38px; padding-top:0; border-radius:50%;
  box-shadow:0 3px 8px rgba(91,143,168,.25);
  flex-shrink:0;
}
.news-card .body{flex:1; min-width:0}
.news-card .title{
  font-family:var(--serif); font-size:16px; font-weight:700; color:var(--fg);
  line-height:1.4; margin-bottom:6px;
}
.news-card .title a{color:inherit; text-decoration:none}
.news-card .title a:hover{color:var(--hi2)}
.news-card .summary{font-size:13px; color:var(--fg2); line-height:1.6; margin-bottom:8px}
.news-card .tags{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.news-card .tag{
  font-size:10px; font-family:var(--mono); letter-spacing:1px;
  background:#EDF0F3; color:var(--fg); padding:2px 8px; border-radius:10px;
  text-transform:uppercase;
}
.news-card .tag.cat{background:var(--accent); color:#FFFFFF}
.news-card .src{font-size:11px; color:var(--fg2); font-family:var(--mono)}
.news-card .fav{
  position:absolute; top:12px; right:14px; cursor:pointer;
  font-size:18px; color:rgba(61,79,92,.2); background:none; border:none;
  transition:color .15s, transform .15s; line-height:1;
}
.news-card .fav:hover{color:var(--hi); transform:scale(1.15)}
.news-card .fav.on{color:var(--hi2)}
.news-card.read{opacity:.6}
.news-card.read .title{font-weight:400}

/* 空状态 */
.empty{
  text-align:center; padding:50px 20px; color:var(--fg2);
  font-family:var(--serif); font-size:16px;
}
.empty .icon{font-size:40px; margin-bottom:10px; opacity:.5}

/* 搜索结果 */
.result-meta{font-size:12px; color:var(--fg2); margin-bottom:14px; font-family:var(--mono)}
.result-meta b{color:var(--hi2)}

/* 底部 */
footer{
  margin-top:40px; padding-top:18px; border-top:1px solid var(--border2);
  font-size:11px; color:var(--fg2); font-family:var(--mono); text-align:center;
  letter-spacing:1px;
}
footer .refresh{color:var(--hi2); cursor:pointer; text-decoration:none; margin-left:8px}
footer .refresh:hover{text-decoration:underline}

/* 加载提示 */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#FFFFFF; border:1px solid var(--accent2); color:var(--fg);
  padding:12px 22px; border-radius:20px; font-size:13px; z-index:100;
  box-shadow:0 8px 24px rgba(123,155,170,.25); opacity:0; transition:opacity .25s, transform .25s;
  pointer-events:none; font-weight:600;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

/* 响应式 */
@media(max-width:680px){
  .brand .meta{display:none}
  .cal-cell{width:54px}
  .cal-cell .num{font-size:17px}
  .news-card{flex-direction:column; gap:6px}
  .news-card .rank{font-size:22px; min-width:0; text-align:left}
  .field{flex:1; min-width:120px}
}
</style>
</head>

<div class="app">

  <section id="calView">

    <!-- 当日新闻面板 -->
    <div class="news-panel" id="newsPanel" style="margin-top:24px"></div>
  </section>

  <!-- ===== 查询结果视图 ===== -->
  <section id="searchView" style="display:none">
    <div class="result-meta" id="resultMeta"></div>
    <div class="news-list" id="searchResults"></div>
  </section>

  <footer>
    数据存于本地浏览器 · 种子数据截至 2026-07-30 · 尽力联网抓取更新
    <a class="refresh" id="refreshBtn">↻ 立即刷新今日</a>
  </footer>
</div>

  "时政":"#C5D4DE",   /* 浅灰蓝 */
  "国际":"#B8C9D6",   /* 深一点灰蓝 */
  "财经":"#C5D8D2",   /* 灰青绿 */
  "科技":"#B8CDE0",   /* 科技蓝 */
  "社会":"#D4CFC8",   /* 暖灰 */
  "体育":"#C8D4C5",   /* 灰绿 */
  "娱乐":"#D0C8D4",   /* 灰紫蓝 */
  "其他":"#CCD2D8"    /* 中性灰蓝 */
};
const CAT_TEXT_COLORS = {
  "时政":"#3D5A6E","国际":"#345060","财经":"#3D5E55","科技":"#34506E",
  "社会":"#5E554A","体育":"#3E5A3E","娱乐":"#554A60","其他":"#4A5560"

/* =========================================================
   状态
========================================================= */
const LS_KEY = 'newsWorkbenchData_v1';
const LS_FAV = 'newsWorkbenchFav_v1';
const LS_READ = 'newsWorkbenchRead_v1';

let state = {
  view: 'calendar',           // calendar | search
  calDate: new Date(),        // 日历当前展示月
  selectedDate: null,         // 选中的日期 yyyy-mm-dd
  data: {},                   // {date: [news]}
  fav: {},                    // {newsId: true}
  read: {},                   // {newsId: true}
  selectedCats: new Set(),
  kw: '', fromDate:'', toDate:''
};

/* =========================================================
   工具函数
========================================================= */
function fmt(d){ // Date -> yyyy-mm-dd
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function todayStr(){ return fmt(new Date()); }
function uid(date, rank){ return `${date}-${rank}`; }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =========================================================
   数据加载与持久化
========================================================= */
function loadData(){
  try{
    const saved = localStorage.getItem(LS_KEY);
    if(saved){
      state.data = JSON.parse(saved);
    }
  }catch(e){ state.data={}; }
  // 合并种子（种子为基线，不覆盖用户已存在日期）
  Object.keys(SEED).forEach(d=>{
    if(!state.data[d]) state.data[d] = JSON.parse(JSON.stringify(SEED[d]));
  });
  try{ state.fav = JSON.parse(localStorage.getItem(LS_FAV)||'{}'); }catch(e){ state.fav={}; }
  try{ state.read = JSON.parse(localStorage.getItem(LS_READ)||'{}'); }catch(e){ state.read={}; }
  saveData();
}
function saveData(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.data)); }catch(e){}
  try{ localStorage.setItem(LS_FAV, JSON.stringify(state.fav)); }catch(e){}
  try{ localStorage.setItem(LS_READ, JSON.stringify(state.read)); }catch(e){}
}

/* =========================================================
   抓取更新（尽力而为，CORS失败静默降级）
========================================================= */
const FETCH_SOURCES = [
  // RSSHub 公共节点 - 央视新闻
  {url:'https://rsshub.app/cctv/news', cat:'时政', weight:3},
  // RSSHub - 新华社
  {url:'https://rsshub.app/xinhuanet/news', cat:'时政', weight:3},
  // RSSHub - 36氪
  {url:'https://rsshub.app/36kr/newsflashes', cat:'科技', weight:2},
  // RSSHub - 澎湃新闻
  {url:'https://rsshub.app/thepaper/newsDetail/25923', cat:'社会', weight:2},
];

async function tryFetchToday(){
  const today = todayStr();
  let items = [];
  const cutoff = new Date(Date.now() - 36*3600*1000); // 36小时内

  for(const src of FETCH_SOURCES){
    try{
      const ctrl = new AbortController();
      const tid = setTimeout(()=>ctrl.abort(), 5000);
      const resp = await fetch(src.url, {signal:ctrl.signal, cache:'no-store'});
      clearTimeout(tid);
      if(!resp.ok) continue;
      const text = await resp.text();
      // 解析 RSS XML
      const doc = new DOMParser().parseFromString(text, 'text/xml');
      const elems = doc.querySelectorAll('item');
      elems.forEach((it, idx)=>{
        if(idx>=8) return;
        const title = it.querySelector('title')?.textContent?.trim() || '';
        const link = it.querySelector('link')?.textContent?.trim() || '';
        const pubD = it.querySelector('pubDate')?.textContent?.trim() || '';
        const desc = it.querySelector('description')?.textContent?.trim() || '';
        let pd = new Date(pubD);
        if(isNaN(pd)) pd = new Date();
        if(pd < cutoff) return;
        items.push({
          rank: 0,
          title: title.replace(/<[^>]+>/g,'').slice(0,80),
          summary: desc.replace(/<[^>]+>/g,'').slice(0,200),
          source: src.cat==='科技'?'36氪':src.cat==='社会'?'澎湃新闻':'央视/新华',
          category: src.cat,
          url: link,
          publishedAt: `${pd.getFullYear()}-${String(pd.getMonth()+1).padStart(2,'0')}-${String(pd.getDate()).padStart(2,'0')} ${String(pd.getHours()).padStart(2,'0')}:${String(pd.getMinutes()).padStart(2,'0')}`,
          _weight: src.weight,
          _ts: pd.getTime()
        });
      });
    }catch(e){ /* CORS 或网络失败，静默 */ }
  }

  if(items.length===0) return false;

  // 去重 + 排序 + 取Top10
  const seen = new Set();
  items = items.filter(it=>{
    const k = it.title.slice(0,20);
    if(seen.has(k)) return false; seen.add(k); return true;
  });
  items.sort((a,b)=> (b._weight - a._weight) || (b._ts - a._ts));
  items = items.slice(0,10).map((it,i)=>({...it, rank:i+1, id: uid(today, 'f'+(i+1))}));
  items.forEach(it=> delete it._weight, delete it._ts);

  // 合并：若抓取结果>=6条则替换今天，否则保留种子
  if(items.length >= 6){
    state.data[today] = items;
    saveData();
    return true;
  }
  return false;
}

function renderHeader(){

  const wk = ['日','一','二','三','四','五','六'][now.getDay()];
  document.getElementById('todayLabel').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

/* =========================================================
   渲染：分类筛选 chips
========================================================= */
function renderCatChips(){
  const box = document.getElementById('catChips');
  box.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const el = document.createElement('span');
    el.className = 'chip';
    el.textContent = c;
    el.onclick = ()=>{
      if(state.selectedCats.has(c)) state.selectedCats.delete(c);
      else state.selectedCats.add(c);
      el.classList.toggle('on');
    };
    box.appendChild(el);
  });
}

/* =========================================================
   渲染：日历（前后两周横向条带）
========================================================= */
function renderCalendar(){
  const center = state.calDate; // 中心日期
  const strip = document.getElementById('calStrip');
  strip.innerHTML='';
  const today = todayStr();
  const dowNames = ['日','一','二','三','四','五','六'];

  // 以 center 为中心，前后各14天，共29天
  for(let off=-14; off<=14; off++){
    const d = new Date(center);
    d.setDate(d.getDate()+off);
    const dateStr = fmt(d);
    const news = state.data[dateStr] || [];

    const el = document.createElement('div');
    el.className = 'cal-cell';
    if(dateStr===today) el.classList.add('today');
    if(dateStr===state.selectedDate) el.classList.add('selected');
    if(news.length>0) el.classList.add('has-news');

    const dowEl = document.createElement('div');
    dowEl.className='dow'; dowEl.textContent = dowNames[d.getDay()];
    el.appendChild(dowEl);

    const numEl = document.createElement('div');
    numEl.className='num'; numEl.textContent = d.getDate();
    el.appendChild(numEl);

    if(news.length>0){
      const dots=document.createElement('div'); dots.className='dots';
      const cats=new Set(news.map(n=>n.category));
      [...cats].slice(0,3).forEach(c=>{
        const dot=document.createElement('span'); dot.className='dot';
        dot.style.background=CAT_COLORS[c]||'#8A9AA5';
        dots.appendChild(dot);
      });
      el.appendChild(dots);
      const cnt=document.createElement('div'); cnt.className='cnt'; cnt.textContent=`${news.length}条`;
      el.appendChild(cnt);
    } else {
      // 占位保持高度一致
      const ph=document.createElement('div'); ph.className='dots'; el.appendChild(ph);
    }

    el.onclick=()=>{
      state.selectedDate=dateStr;
      renderCalendar();
      renderNewsPanel(dateStr);
      // 滚动到选中项
      setTimeout(()=>{
        el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
      },30);
    };
    strip.appendChild(el);
  }

  // 更新标题
  const firstD = new Date(center); firstD.setDate(firstD.getDate()-14);
  const lastD = new Date(center); lastD.setDate(lastD.getDate()+14);
  document.getElementById('calYear').textContent = center.getFullYear()+'年';
  document.getElementById('calRange').textContent =
    `${firstD.getMonth()+1}/${firstD.getDate()} ~ ${lastD.getMonth()+1}/${lastD.getDate()}`;

  // 自动滚动到选中/今天
  setTimeout(()=>{
    const target = strip.querySelector('.cal-cell.selected') || strip.querySelector('.cal-cell.today');
    if(target) target.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  },50);
}

/* =========================================================
   渲染：当日新闻面板
========================================================= */
function renderNewsPanel(dateStr){
  const panel = document.getElementById('newsPanel');
  const news = state.data[dateStr] || [];
  const [y,mm,dd] = dateStr.split('-');
  const wk = ['日','一','二','三','四','五','六'][new Date(dateStr).getDay()];

  let html = `<div class="news-head">
    <h2>📌 每日精选 · Top 10</h2>
    <span class="date">${y}年${parseInt(mm)}月${parseInt(dd)}日 · 星期${wk}</span>
    <span class="sub">共 ${news.length} 条</span>
  </div>`;

  if(news.length===0){
    html += `<div class="empty"><div class="icon">📭</div>当日暂无新闻数据<br><span style="font-size:12px">可点击底部"立即刷新今日"尝试联网抓取</span></div>`;
    panel.innerHTML = html;
    return;
  }

  html += '<div class="news-list">';
  news.forEach(n=>{
    const id = n.id || uid(dateStr, n.rank);
    const isFav = state.fav[id] ? 'on' : '';
    const isRead = state.read[id] ? 'read' : '';
    const catColor = CAT_COLORS[n.category] || '#CCD2D8';
    const catTxt = CAT_TEXT_COLORS[n.category] || '#4A5560';
    html += `<div class="news-card ${isRead}" data-id="${id}">
      <div class="rank">${n.rank}</div>
      <div class="body">
        <div class="title"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a></div>
        <div class="summary">${n.summary}</div>
        <div class="tags">
          <span class="tag cat" style="background:${catColor};color:${catTxt}">${n.category}</span>
          <span class="tag src">${n.source}</span>
          <span class="tag">${n.publishedAt || ''}</span>
        </div>
      </div>
      <button class="fav ${isFav}" data-id="${id}" title="收藏">★</button>
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;

  // 绑定收藏 & 已读
  panel.querySelectorAll('.fav').forEach(b=>{
    b.onclick = (e)=>{
      e.stopPropagation();
      const id = b.dataset.id;
      state.fav[id] = !state.fav[id];
      saveData();
      b.classList.toggle('on');
    };
  });
  panel.querySelectorAll('.news-card .title a').forEach(a=>{
    a.onclick = ()=>{
      const card = a.closest('.news-card');
      const id = card.dataset.id;
      state.read[id] = true; saveData();
      card.classList.add('read');
    };
  });
}

/* =========================================================
   查询功能
========================================================= */
function doSearch(){
  const kw = document.getElementById('kwInput').value.trim().toLowerCase();
  const from = document.getElementById('fromDate').value;
  const to = document.getElementById('toDate').value;
  const cats = state.selectedCats;

  let results = [];
  Object.keys(state.data).forEach(date=>{
    if(from && date < from) return;
    if(to && date > to) return;
    (state.data[date]||[]).forEach(n=>{
      if(cats.size>0 && !cats.has(n.category)) return;
      if(kw){
        const hay = (n.title + ' ' + n.summary + ' ' + n.source).toLowerCase();
        if(!hay.includes(kw)) return;
      }
      results.push({...n, date});
    });
  });
  results.sort((a,b)=> (b.date > a.date ? 1 : -1) || (a.rank - b.rank));

  // 切换到查询视图
  switchView('search');
  const meta = document.getElementById('resultMeta');
  meta.innerHTML = `查询到 <b>${results.length}</b> 条结果 · 关键词「${kw||'无'}」· 分类「${cats.size?[...cats].join('/'):'全部'}」· 日期「${from||'不限'} ~ ${to||'不限'}」`;

  const list = document.getElementById('searchResults');
  if(results.length===0){
    list.innerHTML = `<div class="empty"><div class="icon">🔍</div>未找到匹配的新闻<br><span style="font-size:12px">换个关键词试试？</span></div>`;
    return;
  }
  list.innerHTML = results.map(n=>{
    const id = n.id || uid(n.date, n.rank);
    const isFav = state.fav[id] ? 'on' : '';
    const isRead = state.read[id] ? 'read' : '';
    const catColor = CAT_COLORS[n.category] || '#CCD2D8';
    const catTxt = CAT_TEXT_COLORS[n.category] || '#4A5560';
    const [y,mm,dd] = n.date.split('-');
    return `<div class="news-card ${isRead}" data-id="${id}">
      <div class="rank">${n.rank}</div>
      <div class="body">
        <div class="title"><a href="${n.url}" target="_blank" rel="noopener">${n.title}</a></div>
        <div class="summary">${n.summary}</div>
        <div class="tags">
          <span class="tag cat" style="background:${catColor};color:${catTxt}">${n.category}</span>
          <span class="tag src">${n.source}</span>
          <span class="tag">${n.date} ${n.publishedAt?.split(' ')[1]||''}</span>
        </div>
      </div>
      <button class="fav ${isFav}" data-id="${id}" title="收藏">★</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.fav').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation();
      const id = b.dataset.id;
      state.fav[id] = !state.fav[id]; saveData();
      b.classList.toggle('on');
    };
  });
  list.querySelectorAll('.news-card .title a').forEach(a=>{
    a.onclick = ()=>{
      const card = a.closest('.news-card');
      const id = card.dataset.id;
      state.read[id] = true; saveData();
      card.classList.add('read');
    };
  });
}

/* =========================================================
   视图切换
========================================================= */
function switchView(v){
  state.view = v;
  document.querySelectorAll('.view-tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===v);
  });
  document.getElementById('calView').style.display = v==='calendar'?'block':'none';
  document.getElementById('searchView').style.display = v==='search'?'block':'none';
}

/* =========================================================
   事件绑定
========================================================= */
function bindEvents(){
  document.querySelectorAll('.view-tabs button').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.view==='search' && !document.getElementById('searchResults').children.length){
        doSearch();
      } else {
        switchView(b.dataset.view);
      }
    };
  });

  document.getElementById('prevWeek').onclick = ()=>{
    state.calDate = new Date(state.calDate.getFullYear(), state.calDate.getMonth(), state.calDate.getDate()-14);
    renderCalendar();
  };
  document.getElementById('nextWeek').onclick = ()=>{
    state.calDate = new Date(state.calDate.getFullYear(), state.calDate.getMonth(), state.calDate.getDate()+14);
    renderCalendar();
  };
  document.getElementById('todayBtn').onclick = ()=>{
    state.calDate = new Date();
    state.selectedDate = todayStr();
    renderCalendar();
    renderNewsPanel(state.selectedDate);
  };

  document.getElementById('searchBtn').onclick = doSearch;
  document.getElementById('kwInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') doSearch();
  });
  document.getElementById('resetBtn').onclick = ()=>{
    document.getElementById('kwInput').value='';
    document.getElementById('fromDate').value='';
    document.getElementById('toDate').value='';
    state.selectedCats.clear();
    document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.remove('on'));
    switchView('calendar');
    toast('已重置查询条件');
  };

  document.getElementById('refreshBtn').onclick = async ()=>{
    toast('正在联网抓取今日新闻…');
    const ok = await tryFetchToday();
    if(ok){
      toast('今日新闻已更新');
      if(state.selectedDate===todayStr() || !state.selectedDate){
        state.selectedDate = todayStr();
        renderCalendar();
        renderNewsPanel(state.selectedDate);
      }
    } else {
      toast('未能联网更新，使用现有数据');
    }
  };
}

/* =========================================================
   初始化
========================================================= */
async function init(){
  loadData();
  renderHeader();
  renderCatChips();
  renderCalendar();
  state.selectedDate = todayStr();
  renderNewsPanel(state.selectedDate);
  bindEvents();

  // 默认查询结果区也填一份
  doSearch();
  switchView('calendar');

  // 后台静默尝试抓取今天
  tryFetchToday().then(ok=>{
    if(ok && state.selectedDate===todayStr()){
      renderCalendar();
      renderNewsPanel(state.selectedDate);
    }
  });
}

init();
</script>
